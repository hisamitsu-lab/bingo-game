<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ビンゴ">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>ビンゴ ルーレットマシーン</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell" aria-label="ビンゴ抽選機">
    <header class="masthead">
      <div class="logo" aria-label="ビンゴ">
        <span class="logo-ball blue">ビ</span><span class="logo-ball coral">ン</span><span class="logo-ball yellow">ゴ</span>
      </div>
      <h1>ルーレット マシーン</h1>
      <p class="remaining" id="remaining" aria-live="polite">のこり 75 個</p>
    </header>

    <section class="draw-area" aria-labelledby="number-label">
      <p id="number-label" class="sr-only">今回の抽選番号</p>
      <output id="current-number" class="current-number" aria-live="assertive" aria-atomic="true">?</output>
      <button id="draw-button" class="draw-button" type="button">
        <span aria-hidden="true">☝</span> スタート！
      </button>
      <p id="status" class="status" aria-live="polite">ボタンを押して抽選をはじめよう</p>
    </section>

    <section class="history-area" aria-labelledby="history-title">
      <div class="history-heading">
        <h2 id="history-title">これまでに出た数字は…</h2>
        <button id="reset-button" class="reset-button" type="button">リセット</button>
      </div>
      <ol id="history" class="history" aria-label="抽選済みの数字"></ol>
    </section>
  </main>

  <dialog id="reset-dialog" aria-labelledby="reset-title">
    <form method="dialog">
      <h2 id="reset-title">最初からやり直しますか？</h2>
      <p>出た数字の履歴がすべて消えます。</p>
      <div class="dialog-actions">
        <button value="cancel" class="cancel-button">キャンセル</button>
        <button id="confirm-reset" value="confirm" class="confirm-button">リセットする</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
